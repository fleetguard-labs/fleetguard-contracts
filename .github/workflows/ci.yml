name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fleetguard-contracts
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
        working-directory: fleetguard-contracts
